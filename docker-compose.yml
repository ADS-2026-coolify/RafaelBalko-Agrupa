version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: agrupa-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: agrupadb
      MYSQL_USER: agrupauser
      MYSQL_PASSWORD: agrupapassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./Backend-Alunos
      dockerfile: Dockerfile
    container_name: agrupa-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/agrupadb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: agrupauser
      SPRING_DATASOURCE_PASSWORD: agrupapassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - database

  frontend:
    build:
      context: ./Frontend-Alunos
      dockerfile: Dockerfile
    container_name: agrupa-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: